<div class="layout-preloader-root" [class.root-faded]="phase() !== 'loading'">
  <!-- Phase 1: Morph Loading Sequence -->
  <div class="preloader-loading-view" [class.loading-faded]="phase() !== 'loading'">
    <div class="loader-visual">
      <app-morph-loading variant="morph" size="lg"></app-morph-loading>
    </div>
    <div class="loader-content">
      <div class="loader-brand">
        <span>{{ heroTitle() }}</span>
      </div>
      <p class="loader-tagline">{{ heroSubtitle() }}</p>
    </div>
    <div class="loader-progress-block">
      <div class="loader-track">
        <div class="loader-fill" [style.width.%]="progress()"></div>
      </div>
      <div class="loader-meta">
        <span>Loading Experience</span>
        <span class="loader-counter">{{ progressString() }}</span>
      </div>
    </div>
  </div>

  <!-- Floating Preview HUD over Small Hero Section -->
  <div 
    class="preview-floating-hud" 
    [class.hud-visible]="phase() === 'preview'"
    [class.hud-exiting]="phase() === 'revealing'">
    <div class="preview-badge">
      <span class="status-dot"></span>
      <span>Hero Section Preview</span>
    </div>
    <div class="preview-tag">
      <span>Portfolio // 2025</span>
    </div>
  </div>
</div>
